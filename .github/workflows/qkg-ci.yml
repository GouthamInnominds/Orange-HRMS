name: QKG Automated Ingestion & Quality Gate

on:
  push:
    branches:
      - v2-main
      - main
  pull_request:
    branches:
      - v2-main
      - main
    types: [opened, synchronize, reopened]

jobs:
  qkg-sync-and-gate:
    name: QKG Incremental Sync & Test Impact Analysis
    runs-on: ubuntu-latest

    services:
      neo4j:
        image: neo4j:5.20-community
        env:
          NEO4J_AUTH: neo4j/admin123
        ports:
          - 7474:7474
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p admin123 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for git diff analysis

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: tools/package.json

      - name: Install Tool Dependencies
        working-directory: tools
        run: npm ci

      - name: Determine Git Diff Base and Head
        id: diff-refs
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "BASE_REF=origin/${{ github.base_ref }}" >> $GITHUB_ENV
            echo "HEAD_REF=origin/${{ github.head_ref }}" >> $GITHUB_ENV
          else
            echo "BASE_REF=HEAD~1" >> $GITHUB_ENV
            echo "HEAD_REF=HEAD" >> $GITHUB_ENV
          fi

      - name: Run Baseline Ingestion (if Neo4j is empty)
        run: |
          node tools/qkg_engine/full_app_ingest.js
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: admin123

      - name: Run Incremental Git Diff Sync & Test Impact Analysis (TIA)
        run: |
          node tools/qkg_engine/incremental_sync.js "$BASE_REF" "$HEAD_REF"
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: admin123

      - name: Upload Ingestion Audit Reports
        uses: actions/upload-artifact@v4
        with:
          name: qkg-ingestion-reports
          path: |
            tools/qkg_engine/output/incremental_sync_report.md
            tools/qkg_engine/output/incremental_sync_report.json
            tools/qkg_engine/output/full_ingestion_audit_report.json

      - name: Post TIA Report Comment on Pull Request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'tools/qkg_engine/output/incremental_sync_report.md';
            if (fs.existsSync(reportPath)) {
              const body = fs.readFileSync(reportPath, 'utf8');
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }
