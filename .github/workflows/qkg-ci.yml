name: QKG CI/CD Quality Gate & Unified Ingestion

on:
  pull_request:
    branches:
      - v2-main
      - main
    types: [opened, synchronize, reopened]

  pull_request_target:
    types: [closed]
    branches:
      - v2-main
      - main

  push:
    branches:
      - v2-main

concurrency:
  group: qkg-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # JOB 1: PR Quality Gate — Staging QKG Build + Real TIA Simulation (NO PROD MUTATION)
  # =========================================================================
  pr-quality-gate:
    name: PR Impact Analysis & Selective Test Gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    services:
      neo4j-staging:
        image: neo4j:5.20-community
        env:
          NEO4J_AUTH: neo4j/admin123
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p admin123 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout App Branch
        uses: actions/checkout@v4
        with:
          path: app-repo
          fetch-depth: 0

      - name: Checkout Standalone QA Repo (orangehrm-qa-automation)
        id: qa_checkout
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: GouthamInnominds/orangehrm-qa-automation
          ref: main
          path: qa-repo
          token: ${{ secrets.QA_REPO_TOKEN || github.token }}

      - name: Resolve QA Repo Configuration
        id: qa_env
        run: |
          if [ -d "${{ github.workspace }}/qa-repo/.git" ]; then
            QA_SHA=$(git -C "${{ github.workspace }}/qa-repo" rev-parse HEAD)
            echo "QKG_QA_REPO_DIR=${{ github.workspace }}/qa-repo" >> "$GITHUB_ENV"
            echo "qa_commit=$QA_SHA" >> "$GITHUB_OUTPUT"
            echo "QA repo checked out at $QA_SHA"
          else
            echo "qa_commit=unconfigured" >> "$GITHUB_OUTPUT"
            echo "::warning::Standalone QA repo checkout skipped (private/token unavailable). External QA specs will not be ingested."
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: app-repo/tools/package.json

      - name: Install QKG Engine Dependencies
        working-directory: app-repo/tools
        run: npm ci

      - name: Run Node Unit & Architecture Tests
        working-directory: app-repo/tools
        run: node --test test/*.test.js

      - name: Build Staging QKG & Validate 24/24 Golden Checks
        working-directory: app-repo
        run: |
          echo "::warning::Live MariaDB schema reconciliation skipped in ephemeral CI (--no-mariadb). Run local/staging promote without --no-mariadb for full schema reconciliation."
          node tools/qkg_engine/ingest_pipeline.js --uri bolt://localhost:7687 --clean --no-mariadb
          node tools/qkg_engine/validate_golden_dataset.js
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: admin123

      - name: Run Multi-Channel TIA Simulation
        working-directory: app-repo
        run: node tools/qkg_engine/incremental_sync.js --simulate "origin/${{ github.base_ref }}" "HEAD"
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: admin123

      - name: Post Multi-Channel TIA Report on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'app-repo/tools/qkg_engine/output/incremental_sync_report.md';
            if (fs.existsSync(reportPath)) {
              const qaSha = '${{ steps.qa_env.outputs.qa_commit }}';
              const footer = `\n\n---\n- **QA Repo (` + '`orangehrm-qa-automation`' + `):** \`${qaSha}\`\n- **Live MariaDB Schema Reconciliation:** \`SKIPPED (--no-mariadb)\` in ephemeral CI gate; static Doctrine/SQL DDL columns validated (\`24/24\` Golden Checks).`;
              const body = fs.readFileSync(reportPath, 'utf8') + footer;
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body
              });
            }

  # =========================================================================
  # JOB 2: Post-Merge Full PHPUnit/Jest Coverage + Production QKG Publish
  # =========================================================================
  post-merge-qkg-publish:
    name: Full Coverage Run & QKG Snapshot Publication
    if: >
      (github.event_name == 'pull_request_target' && github.event.pull_request.merged == true) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/v2-main')
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      neo4j-production:
        image: neo4j:5.20-community
        env:
          NEO4J_AUTH: neo4j/admin123
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p admin123 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Merged Target Branch
        uses: actions/checkout@v4
        with:
          path: app-repo
          fetch-depth: 0

      - name: Checkout Standalone QA Repo (orangehrm-qa-automation)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: GouthamInnominds/orangehrm-qa-automation
          ref: main
          path: qa-repo
          token: ${{ secrets.QA_REPO_TOKEN || github.token }}

      - name: Resolve QA Repo Configuration
        run: |
          if [ -d "${{ github.workspace }}/qa-repo/.git" ]; then
            QA_SHA=$(git -C "${{ github.workspace }}/qa-repo" rev-parse HEAD)
            echo "QKG_QA_REPO_DIR=${{ github.workspace }}/qa-repo" >> "$GITHUB_ENV"
            echo "QA repo checked out at $QA_SHA"
          else
            echo "::warning::Standalone QA repo checkout skipped (private/token unavailable)."
          fi

      - name: Setup PHP 8.1 with PCOV
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: pcov
          tools: composer:v2

      - name: Install Composer Dependencies
        working-directory: app-repo/orange_hrm/src
        run: composer install --no-interaction --prefer-dist

      - name: Execute All 22 PHPUnit Suites with Clover Coverage & JUnit XML
        working-directory: app-repo
        run: |
          mkdir -p artifacts
          php -d pcov.enabled=1 -d pcov.directory=orange_hrm/src/plugins orange_hrm/src/vendor/bin/phpunit \
            -c orange_hrm/phpunit.xml \
            --coverage-clover artifacts/phpunit-clover.xml \
            --log-junit artifacts/phpunit-junit.xml

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: app-repo/tools/package.json

      - name: Install QKG & Client Dependencies and Run Core Jest Coverage
        working-directory: app-repo
        run: |
          cd tools && npm ci
          mkdir -p ../artifacts/jest-cov
          cd ../orange_hrm/src/client && npm ci && npx jest --coverage --coverageReporters=clover --coverageDirectory=../../artifacts/jest-cov --json --outputFile=../../artifacts/jest-results.json --ci

      - name: Unified QKG Ingestion + 24/24 Golden Validation
        working-directory: app-repo
        run: |
          echo "::warning::Live MariaDB schema reconciliation skipped in ephemeral CI (--no-mariadb)."
          node tools/qkg_engine/ingest_pipeline.js --uri bolt://localhost:7687 --clean --no-mariadb
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: admin123

      - name: Ingest PHPUnit & Jest Coverage + Execution History
        working-directory: app-repo
        run: |
          node tools/qkg_engine/coverage_ingestion.js artifacts/phpunit-clover.xml "${{ github.run_id }}" "${{ github.sha }}" phpunit all
          node tools/qkg_engine/coverage_ingestion.js artifacts/jest-cov/clover.xml "${{ github.run_id }}" "${{ github.sha }}" jest client
          node tools/qkg_engine/execution_history_ingestion.js junit artifacts/phpunit-junit.xml "${{ github.run_id }}" "${{ github.sha }}" all
          node tools/qkg_engine/execution_history_ingestion.js jest artifacts/jest-results.json "${{ github.run_id }}" "${{ github.sha }}" client
          node tools/qkg_engine/validate_golden_dataset.js
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: admin123

      - name: Upload CI Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qkg-coverage-and-validation
          path: |
            app-repo/artifacts/
            app-repo/tools/qkg_engine/output/incremental_sync_report.json
