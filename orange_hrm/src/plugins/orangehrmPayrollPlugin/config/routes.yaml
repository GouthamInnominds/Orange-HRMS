# OrangeHRM India-Standard Payroll Extension v2.2 Routes

##########################
#   REST V2 API Routes
##########################

apiv2_payroll_pay_periods:
  path: /api/v2/payroll/pay-periods
  controller: OrangeHRM\Core\Controller\Rest\V2\GenericRestController::handle
  methods: [ GET, POST, DELETE ]
  defaults:
    _api: OrangeHRM\Payroll\Api\PayPeriodAPI

apiv2_payroll_pay_period:
  path: /api/v2/payroll/pay-periods/{id}
  controller: OrangeHRM\Core\Controller\Rest\V2\GenericRestController::handle
  methods: [ GET, PUT ]
  defaults:
    _api: OrangeHRM\Payroll\Api\PayPeriodAPI
  requirements:
    id: '\d+'

